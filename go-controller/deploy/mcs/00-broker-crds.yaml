---
# Broker CRDs - Custom OVN-Kubernetes multi-cluster resources
# These CRDs are installed in the broker cluster only
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: clusterinfos.broker.ovn.org
spec:
  group: broker.ovn.org
  names:
    kind: ClusterInfo
    listKind: ClusterInfoList
    plural: clusterinfos
    singular: clusterinfo
  scope: Cluster
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: ClusterInfo represents a cluster participating in the multi-cluster broker.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - clusterID
            properties:
              clusterID:
                type: string
                description: Unique identifier for this cluster
              serviceCIDR:
                type: array
                items:
                  type: string
                description: Service CIDR range(s)
              clusterCIDR:
                type: array
                items:
                  type: string
                description: Pod CIDR range(s) for default network
              globalCIDR:
                type: array
                items:
                  type: string
                description: Global pod CIDR range(s) for UDN/CUDN networks
              networks:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    cidr:
                      type: array
                      items:
                        type: string
                description: UDN/CUDN network information
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceexports.broker.ovn.org
spec:
  group: broker.ovn.org
  names:
    kind: ServiceExport
    listKind: ServiceExportList
    plural: serviceexports
    singular: serviceexport
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: ServiceExport represents a service exported from a member cluster to the broker.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            required:
            - serviceName
            - serviceNamespace
            properties:
              serviceName:
                type: string
                description: Name of the exported service
              serviceNamespace:
                type: string
                description: Namespace of the exported service
              ports:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    protocol:
                      type: string
                    port:
                      type: integer
                      format: int32
                    appProtocol:
                      type: string
                description: Ports exposed by the service
          status:
            type: object
            properties:
              clusterID:
                type: string
                description: ID of the cluster exporting this service
              networkName:
                type: string
                description: UDN network name for this service
              clusterSetIP:
                type: string
                description: ClusterSet-scoped IP allocated for this service
              endpoints:
                type: array
                items:
                  type: object
                  properties:
                    address:
                      type: string
                    hostname:
                      type: string
                    nodeName:
                      type: string
                    zone:
                      type: string
                    ready:
                      type: boolean
                description: Service endpoints from the exporting cluster
              conditions:
                type: array
                items:
                  type: object
                  properties:
                    type:
                      type: string
                    status:
                      type: string
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
    subresources:
      status: {}
