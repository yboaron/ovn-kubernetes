---
# Upstream Multi-Cluster Services API CRDs (KEP-1645)
# These CRDs are installed in member clusters (not broker)
# Users create ServiceExport resources to export services
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceexports.multicluster.x-k8s.io
spec:
  group: multicluster.x-k8s.io
  names:
    kind: ServiceExport
    listKind: ServiceExportList
    plural: serviceexports
    singular: serviceexport
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: ServiceExport declares that the Service with the same name and namespace should be exported.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          status:
            type: object
            properties:
              conditions:
                type: array
                items:
                  type: object
                  required:
                  - type
                  - status
                  properties:
                    type:
                      type: string
                      description: Type of condition (Valid, Conflict, etc.)
                    status:
                      type: string
                      enum: ["True", "False", "Unknown"]
                    lastTransitionTime:
                      type: string
                      format: date-time
                    reason:
                      type: string
                    message:
                      type: string
    subresources:
      status: {}
---
apiVersion: apiextensions.k8s.io/v1
kind: CustomResourceDefinition
metadata:
  name: serviceimports.multicluster.x-k8s.io
spec:
  group: multicluster.x-k8s.io
  names:
    kind: ServiceImport
    listKind: ServiceImportList
    plural: serviceimports
    singular: serviceimport
  scope: Namespaced
  versions:
  - name: v1alpha1
    served: true
    storage: true
    schema:
      openAPIV3Schema:
        description: ServiceImport describes a service imported from clusters in a ClusterSet.
        type: object
        properties:
          apiVersion:
            type: string
          kind:
            type: string
          metadata:
            type: object
          spec:
            type: object
            properties:
              type:
                type: string
                enum: [ClusterSetIP, Headless]
                description: Type of this service (ClusterSetIP or Headless)
              ips:
                type: array
                items:
                  type: string
                description: ClusterSet IPs for this service
              ports:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    protocol:
                      type: string
                      default: TCP
                    port:
                      type: integer
                      format: int32
                    appProtocol:
                      type: string
              sessionAffinity:
                type: string
                enum: [None, ClientIP]
                description: Session affinity type
              sessionAffinityConfig:
                type: object
                properties:
                  clientIP:
                    type: object
                    properties:
                      timeoutSeconds:
                        type: integer
                        format: int32
                        minimum: 0
                        maximum: 86400
          status:
            type: object
            properties:
              clusters:
                type: array
                description: List of clusters providing this service
                items:
                  type: object
                  required:
                  - cluster
                  properties:
                    cluster:
                      type: string
                      description: Cluster identifier
    subresources:
      status: {}
